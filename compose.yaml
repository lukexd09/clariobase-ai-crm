services:
  crm-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CRM_POSTGRES_DB:-clariobase_crm}
      POSTGRES_USER: ${CRM_POSTGRES_USER:-clariobase_crm_user}
      POSTGRES_PASSWORD: ${CRM_POSTGRES_PASSWORD:?Set_CRM_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data

  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      crm-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CRM_DEPLOYMENT_ENV: production
      DATABASE_URL: ${CRM_DATABASE_URL:-postgresql://${CRM_POSTGRES_USER:-clariobase_crm_user}:${CRM_POSTGRES_PASSWORD:?Set_CRM_POSTGRES_PASSWORD}@crm-postgres:5432/${CRM_POSTGRES_DB:-clariobase_crm}?schema=public}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then((response) => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${CRM_BIND_ADDRESS:-127.0.0.1}:${CRM_HOST_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${AI_EXCHANGE_HOST_PATH:-./data/ai-exchange}
        target: /app/data/ai-exchange

volumes:
  crm-postgres-data:
