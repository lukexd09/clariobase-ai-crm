services:
  crm-postgres:
    labels:
      io.clariobase.runtime-scope: preview
      io.clariobase.preview-slot: manual

  crm-app:
    labels:
      io.clariobase.runtime-scope: preview
      io.clariobase.preview-slot: manual
    build: !reset null
    image: ${CRM_PREVIEW_IMAGE_REF:?Set_CRM_PREVIEW_IMAGE_REF}
    pull_policy: never
    environment:
      CRM_DEPLOYMENT_ENV: preview

networks:
  default:
    name: clariobase-crm-preview-network
    labels:
      io.clariobase.runtime-scope: preview
      io.clariobase.preview-slot: manual

volumes:
  crm-postgres-data:
    name: clariobase-crm-preview-postgres-data
    labels:
      io.clariobase.runtime-scope: preview
      io.clariobase.preview-slot: manual
