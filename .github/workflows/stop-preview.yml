name: Stop Preview

on:
  workflow_dispatch:
    inputs:
      database_mode:
        description: Preview database lifecycle mode
        required: false
        default: preserve
        type: choice
        options:
          - preserve
          - reset
      reset_confirmation:
        description: Exact confirmation phrase required for reset mode
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: clariobase-preview-slot
  cancel-in-progress: false

jobs:
  stop-preview:
    runs-on:
      - self-hosted
      - windows
      - x64
      - clariobase-preview
    environment: e016-preview-operator
    if: github.actor == github.repository_owner

    steps:
      - name: Check out trusted control checkout
        uses: actions/checkout@v5
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        working-directory: control
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        working-directory: control
        run: corepack pnpm install --frozen-lockfile

      - name: Stop preview
        shell: pwsh
        working-directory: control
        id: stop
        env:
          DATABASE_MODE: ${{ inputs.database_mode }}
          RESET_CONFIRMATION: ${{ inputs.reset_confirmation }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\stop-preview.ps1 `
            -RequestedRef stop-preview `
            -DatabaseMode $env:DATABASE_MODE `
            -ResetConfirmation $env:RESET_CONFIRMATION `
            -ControlCheckoutPath $PWD

          $stopExitCode = $LASTEXITCODE

          if ($stopExitCode -ne 0) {
            throw "Stop preview script failed with exit code $stopExitCode."
          }

      - name: Write job summary
        if: always()
        shell: pwsh
        working-directory: control
        env:
          DATABASE_MODE: ${{ inputs.database_mode }}
          STOP_RESULT: ${{ steps.stop.conclusion }}
          STOP_EXIT_CODE: ${{ steps.stop.outcome }}
        run: |
          if ($env:DATABASE_MODE -eq "reset" -and $env:STOP_RESULT -eq "failure") {
            $databaseVolume = "unchanged"
          } elseif ($env:DATABASE_MODE -eq "reset") {
            $databaseVolume = "reset"
          } else {
            $databaseVolume = "preserved"
          }

          $result = if ($env:STOP_RESULT -eq "failure") { "BLOCKED" } else { "PASS" }
          @"
          Result: $result

          Requested ref: `stop-preview`
          Database mode: `${{ inputs.database_mode }}`
          Database volume: `$databaseVolume`
          Preview URL: `http://Serwer:3001`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Fail workflow if stop failed
        if: always()
        shell: pwsh
        env:
          STOP_RESULT: ${{ steps.stop.conclusion }}
        run: |
          if ($env:STOP_RESULT -eq "failure") {
            throw "Stop preview failed."
          }

      - name: Cleanup secrets and job artifacts
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          Remove-Item .env.compose.preview.local, deploy-preview-result.json, stop-preview-result.json -Force -ErrorAction SilentlyContinue
