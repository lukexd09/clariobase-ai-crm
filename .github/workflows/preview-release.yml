name: Preview Release

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: Preview release source
        required: true
        default: open_pr
        type: choice
        options:
          - open_pr
          - main
      pr_number:
        description: Open pull request number for open_pr mode; leave empty for main
        required: false
        default: ""
        type: string
      expected_sha:
        description: Optional exact expected source SHA
        required: false
        default: ""
        type: string
      database_mode:
        description: Preview database lifecycle mode
        required: false
        default: preserve
        type: choice
        options:
          - preserve
          - reset
      reset_confirmation:
        description: Exact confirmation phrase required for reset mode
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: clariobase-preview-slot
  cancel-in-progress: false

env:
  PREVIEW_PRIVATE_HOSTNAME: clariobase-crm-preview.home.arpa
  PREVIEW_PRIVATE_HTTPS_PORT: "3001"

jobs:
  resolve-preview-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      resolution_status: ${{ steps.resolve.outputs.resolution_status }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      source_mode: ${{ steps.resolve.outputs.source_mode }}
      reporting_target: ${{ steps.resolve.outputs.reporting_target }}
      control_plane_restrictions_apply: ${{ steps.resolve.outputs.control_plane_restrictions_apply }}
      validation_run_type: ${{ steps.resolve.outputs.validation_run_type }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_url: ${{ steps.resolve.outputs.pr_url }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      validated_sha: ${{ steps.resolve.outputs.validated_sha }}
      database_mode: ${{ steps.resolve.outputs.database_mode }}
      reset_confirmation: ${{ steps.resolve.outputs.reset_confirmation }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      ci_run_url: ${{ steps.resolve.outputs.ci_run_url }}
      preview_url: ${{ steps.resolve.outputs.preview_url }}

    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve preview release source and validation run
        id: resolve
        uses: actions/github-script@v8
        env:
          EXPECTED_REPOSITORY: lukexd09/clariobase-ai-crm
          REQUESTED_SOURCE_MODE: ${{ inputs.source_mode }}
          REQUESTED_PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUESTED_DATABASE_MODE: ${{ inputs.database_mode }}
          REQUESTED_RESET_CONFIRMATION: ${{ inputs.reset_confirmation }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");
            const { execFileSync } = require("node:child_process");
            const policy = require("./scripts/preview-release-policy.js");

            const expectedRepository = process.env.EXPECTED_REPOSITORY || "";
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const sourceMode = policy.normalizeSourceMode(process.env.REQUESTED_SOURCE_MODE);
            const requestedPrNumber = process.env.REQUESTED_PR_NUMBER || "";
            const requestedExpectedSha = process.env.REQUESTED_EXPECTED_SHA || "";
            const requestedDatabaseMode = process.env.REQUESTED_DATABASE_MODE || "preserve";
            const requestedResetConfirmation = process.env.REQUESTED_RESET_CONFIRMATION || "";
            const dispatchRef = process.env.DISPATCH_REF || "";
            const dispatchSha = process.env.DISPATCH_SHA || "";

            const output = {
              resolution_status: "blocked",
              should_deploy: "false",
              source_mode: sourceMode,
              reporting_target: sourceMode === "open_pr" ? "pull_request" : "none",
              control_plane_restrictions_apply: sourceMode === "open_pr" ? "true" : "false",
              validation_run_type: sourceMode === "open_pr" ? "exact_head_ci" : "full_integration_main_push",
              pr_number: "",
              pr_url: "",
              head_ref: "",
              validated_sha: "",
              database_mode: "unknown",
              reset_confirmation: "",
              skip_reason: "BLOCKED: ambiguous preview release request",
              ci_run_id: "",
              ci_run_url: "",
              preview_url: `https://${process.env.PREVIEW_PRIVATE_HOSTNAME || ""}:${process.env.PREVIEW_PRIVATE_HTTPS_PORT || ""}`
            };

            const finish = (overrides = {}) => {
              Object.assign(output, overrides);
              for (const [name, value] of Object.entries(output)) {
                core.setOutput(name, String(value ?? ""));
              }
            };

            const block = (reason, overrides = {}) => {
              finish({
                resolution_status: "blocked",
                should_deploy: "false",
                skip_reason: reason,
                ...overrides
              });
            };

            try {
              if (repository !== expectedRepository) {
                block(`BLOCKED: repository must be ${expectedRepository}`);
                return;
              }

              if (dispatchRef !== "refs/heads/main") {
                block("BLOCKED: Preview Release must be dispatched from main");
                return;
              }

              const commonInput = {
                repository,
                expectedRepository,
                sourceMode,
                databaseMode: requestedDatabaseMode,
                expectedSha: requestedExpectedSha,
                resetConfirmation: requestedResetConfirmation,
                dispatchRef
              };

              if (sourceMode === "open_pr") {
                const pullNumber = policy.parsePositiveInteger(requestedPrNumber, "pr_number");
                const pullResponse = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber
                });
                const pull = pullResponse.data;
                const headSha = String(pull.head?.sha || "").toLowerCase();
                const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                  per_page: 100
                });
                const normalizedChangedFiles = changedFiles.map((file) => ({
                  filename: String(file?.filename || ""),
                  previous_filename: String(file?.previous_filename || "")
                }));
                const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "ci.yml",
                  event: "pull_request",
                  status: "completed",
                  head_sha: headSha,
                  per_page: 100
                });
                const exactHeadCiRun = policy.selectLatestSuccessfulRun(workflowRuns, (run) => run.name === "CI" && run.head_sha === headSha);

                if (!exactHeadCiRun) {
                  throw new Error("no successful Fast CI run exists for the exact current PR head SHA");
                }

                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: exactHeadCiRun.id,
                  per_page: 100
                });
                const contextArtifact = policy.selectPreviewContextArtifact(artifacts);

                if (!contextArtifact) {
                  throw new Error("exact Fast CI run does not contain a valid auto-preview-context artifact");
                }

                const temporaryDirectory = fs.mkdtempSync(path.join(os.tmpdir(), "clariobase-preview-release-"));
                const archivePath = path.join(temporaryDirectory, "auto-preview-context.zip");

                try {
                  const archiveResponse = await github.request(
                    "GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}/{archive_format}",
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      artifact_id: contextArtifact.id,
                      archive_format: "zip"
                    }
                  );
                  fs.writeFileSync(archivePath, Buffer.from(archiveResponse.data));
                  const contextJson = execFileSync("unzip", ["-p", archivePath, "auto-preview-context.json"], {
                    encoding: "utf8"
                  });
                  const artifactContext = JSON.parse(contextJson);

                  const result = policy.validatePreviewReleaseRequest({
                    ...commonInput,
                    requestedPrNumber,
                    pullRequest: pull,
                    changedFiles: normalizedChangedFiles,
                    exactHeadCiRun,
                    artifactContext
                  });
                  finish(result);
                } finally {
                  fs.rmSync(temporaryDirectory, { recursive: true, force: true });
                }
                return;
              }

              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "full-integration.yml",
                event: "push",
                branch: "main",
                status: "completed",
                head_sha: dispatchSha,
                per_page: 100
              });
              const fullIntegrationRun = policy.selectLatestSuccessfulRun(
                workflowRuns,
                (run) => run.name === "Full Integration" && run.event === "push" && run.head_branch === "main" && run.head_sha === dispatchSha
              );

              if (!fullIntegrationRun) {
                throw new Error("no successful exact-SHA Full Integration run exists for the trusted main commit");
              }

              finish(
                policy.validatePreviewReleaseRequest({
                  ...commonInput,
                  requestedPrNumber,
                  sourceSha: dispatchSha,
                  fullIntegrationRun
                })
              );
            } catch (error) {
              core.warning(error instanceof Error ? error.message : String(error));
              block(`BLOCKED: ${error instanceof Error ? error.message : String(error)}`);
            }

      - name: Write resolution summary
        if: always()
        shell: bash
        env:
          RESOLUTION_STATUS: ${{ steps.resolve.outputs.resolution_status }}
          SOURCE_MODE: ${{ steps.resolve.outputs.source_mode }}
          REPORTING_TARGET: ${{ steps.resolve.outputs.reporting_target }}
          VALIDATION_RUN_TYPE: ${{ steps.resolve.outputs.validation_run_type }}
          PR_URL: ${{ steps.resolve.outputs.pr_url }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          VALIDATED_SHA: ${{ steps.resolve.outputs.validated_sha }}
          CI_RUN_URL: ${{ steps.resolve.outputs.ci_run_url }}
          DATABASE_MODE: ${{ steps.resolve.outputs.database_mode }}
          REASON: ${{ steps.resolve.outputs.skip_reason }}
        run: |
          if [ "${RESOLUTION_STATUS:-blocked}" = "blocked" ]; then
            DATABASE_VOLUME="unchanged"
            DEPLOYMENT_RESULT="blocked"
          elif [ "${DATABASE_MODE:-preserve}" = "reset" ]; then
            DATABASE_VOLUME="reset"
            DEPLOYMENT_RESULT="queued"
          else
            DATABASE_VOLUME="preserved"
            DEPLOYMENT_RESULT="queued"
          fi

          {
            echo "Result: ${RESOLUTION_STATUS:-blocked}"
            echo
            echo "Source mode: ${SOURCE_MODE:-unknown}"
            echo "Reporting target: ${REPORTING_TARGET:-unknown}"
            echo "Validation run: ${VALIDATION_RUN_TYPE:-unknown}"
            echo "PR: ${PR_URL:-n/a}"
            echo "Branch: ${HEAD_REF:-n/a}"
            echo "Validated SHA: ${VALIDATED_SHA:-n/a}"
            echo "Database mode: ${DATABASE_MODE:-unknown}"
            echo "Database volume: ${DATABASE_VOLUME}"
            echo "Image identity: n/a"
            echo "Deployment result: ${DEPLOYMENT_RESULT}"
            echo "Fast CI run: ${CI_RUN_URL:-n/a}"
            echo "Reason: ${REASON:-eligible}"
          } >> "$GITHUB_STEP_SUMMARY"

  report-blocked:
    needs: resolve-preview-release
    if: always() && needs.resolve-preview-release.outputs.resolution_status == 'blocked'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Upsert blocked preview comment
        if: needs.resolve-preview-release.outputs.pr_number != '' && needs.resolve-preview-release.outputs.reporting_target == 'pull_request'
        uses: actions/github-script@v8
        env:
          SOURCE_MODE: ${{ needs.resolve-preview-release.outputs.source_mode }}
          PR_NUMBER: ${{ needs.resolve-preview-release.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-preview-release.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-preview-release.outputs.ci_run_url }}
          DATABASE_MODE: ${{ needs.resolve-preview-release.outputs.database_mode }}
          BLOCK_REASON: ${{ needs.resolve-preview-release.outputs.skip_reason }}
          PREVIEW_URL: ${{ needs.resolve-preview-release.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const issue_number = Number(process.env.PR_NUMBER);
            const databaseMode = process.env.DATABASE_MODE || "unknown";
            const databaseVolume = "unchanged";
            const body = [
              marker,
              "",
              "Preview blocked",
              "",
              "Result: blocked",
              `Source mode: ${process.env.SOURCE_MODE || "unknown"}`,
              `Database mode: ${databaseMode}`,
              `Database volume: ${databaseVolume}`,
              `Reason: ${process.env.BLOCK_REASON || "BLOCKED: preview release resolver execution failed"}`,
              `PR: #${issue_number}`,
              `Commit: ${process.env.VALIDATED_SHA || "n/a"}`,
              `Branch: ${process.env.HEAD_REF || "n/a"}`,
              `Fast CI run: ${process.env.CI_RUN_URL || "n/a"}`,
              "Image build run: n/a",
              "Immutable image: n/a",
              `Deployment run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Preview URL: ${process.env.PREVIEW_URL || "n/a"}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

      - name: Fail blocked preview gate
        shell: bash
        env:
          BLOCK_REASON: ${{ needs.resolve-preview-release.outputs.skip_reason }}
        run: |
          echo "${BLOCK_REASON:-BLOCKED: preview release request rejected}" >&2
          exit 1

  report-queued:
    needs: resolve-preview-release
    if: needs.resolve-preview-release.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Upsert queued preview comment
        if: needs.resolve-preview-release.outputs.reporting_target == 'pull_request'
        uses: actions/github-script@v8
        env:
          SOURCE_MODE: ${{ needs.resolve-preview-release.outputs.source_mode }}
          PR_NUMBER: ${{ needs.resolve-preview-release.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-preview-release.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-preview-release.outputs.ci_run_url }}
          DATABASE_MODE: ${{ needs.resolve-preview-release.outputs.database_mode }}
          PREVIEW_URL: ${{ needs.resolve-preview-release.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const issue_number = Number(process.env.PR_NUMBER);
            const databaseVolume = "unchanged";
            const body = [
              marker,
              "",
              "Preview queued",
              "",
              "Result: queued",
              `Source mode: ${process.env.SOURCE_MODE || "unknown"}`,
              `Database mode: ${process.env.DATABASE_MODE || "preserve"}`,
              `Database volume: ${databaseVolume}`,
              `PR: #${issue_number}`,
              `Commit: ${process.env.VALIDATED_SHA}`,
              `Branch: ${process.env.HEAD_REF}`,
              `Fast CI run: ${process.env.CI_RUN_URL}`,
              `Image build run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "Immutable image: pending",
              `Deployment run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Preview URL: ${process.env.PREVIEW_URL || "n/a"}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

  build-preview-image:
    needs:
      - resolve-preview-release
      - report-queued
    if: needs.resolve-preview-release.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
      source_sha: ${{ steps.publish.outputs.source_sha }}
      source_mode: ${{ steps.publish.outputs.source_mode }}
      ci_run_id: ${{ steps.publish.outputs.ci_run_id }}
      image_build_run_id: ${{ steps.publish.outputs.image_build_run_id }}

    steps:
      - name: Check out validated source SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Expected source SHA $EXPECTED_SHA but checked out $ACTUAL_SHA" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.resolve-preview-release.outputs.validated_sha }}

      - name: Build immutable preview image
        id: build-image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=preview-image
          cache-to: type=gha,mode=max,scope=preview-image

      - name: Smoke test immutable image
        shell: pwsh
        run: |
          $imageRef = "ghcr.io/${{ github.repository }}:${{ needs.resolve-preview-release.outputs.validated_sha }}"
          $env:CRM_PREVIEW_IMAGE_REF = $imageRef
          $env:CRM_POSTGRES_PASSWORD = "preview-password"
          pnpm exec tsx tests/fixtures/health-container-smoke.ts $imageRef 3001

      - name: Log in to GitHub Container Registry
        id: ghcr-login
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push immutable preview image
        id: push
        shell: bash
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ needs.resolve-preview-release.outputs.validated_sha }}
        run: |
          docker push "$IMAGE_TAG" | tee docker-push.log

          mapfile -t DIGESTS < <(
            sed -nE 's/^.*digest: (sha256:[0-9a-f]{64})( size:.*)?$/\1/p' docker-push.log |
              sort -u
          )

          if [ "${#DIGESTS[@]}" -ne 1 ]; then
            echo "Expected exactly one pushed registry digest, found ${#DIGESTS[@]}." >&2
            exit 1
          fi

          IMAGE_DIGEST="${DIGESTS[0]}"

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid registry digest: $IMAGE_DIGEST" >&2
            exit 1
          fi

          IMAGE_REF="ghcr.io/${{ github.repository }}@${IMAGE_DIGEST}"
          {
            echo "image_digest=${IMAGE_DIGEST}"
            echo "image_ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish immutable image metadata
        id: publish
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve-preview-release.outputs.pr_number }}
          SOURCE_MODE: ${{ needs.resolve-preview-release.outputs.source_mode }}
          SOURCE_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          CI_RUN_ID: ${{ needs.resolve-preview-release.outputs.ci_run_id }}
          IMAGE_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository }}@${IMAGE_DIGEST}"
          if [ -n "$PR_NUMBER" ]; then
            PR_NUMBER_JSON="$PR_NUMBER"
          else
            PR_NUMBER_JSON=null
          fi

          cat > immutable-preview-image.json <<JSON
          {
            "repository": "${{ github.repository }}",
            "prNumber": ${PR_NUMBER_JSON},
            "sourceMode": "${SOURCE_MODE}",
            "sourceSha": "${SOURCE_SHA}",
            "image": "ghcr.io/${{ github.repository }}",
            "digest": "${IMAGE_DIGEST}",
            "imageRef": "${IMAGE_REF}",
            "ciRunId": "${CI_RUN_ID}",
            "imageBuildRunId": "${IMAGE_BUILD_RUN_ID}",
            "deploymentRunId": "${{ github.run_id }}"
          }
          JSON

          {
            echo "image_ref=${IMAGE_REF}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo "source_sha=${SOURCE_SHA}"
            echo "source_mode=${SOURCE_MODE}"
            echo "ci_run_id=${CI_RUN_ID}"
            echo "image_build_run_id=${IMAGE_BUILD_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable preview image metadata
        uses: actions/upload-artifact@v4
        with:
          name: immutable-preview-image
          path: immutable-preview-image.json
          retention-days: 7

      - name: Log out of GitHub Container Registry
        if: always() && steps.ghcr-login.conclusion == 'success'
        shell: bash
        run: docker logout ghcr.io

  report-deploying:
    needs:
      - resolve-preview-release
      - build-preview-image
    if: needs.resolve-preview-release.outputs.should_deploy == 'true' && needs.build-preview-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Upsert deploying preview comment
        if: needs.resolve-preview-release.outputs.reporting_target == 'pull_request'
        uses: actions/github-script@v8
        env:
          SOURCE_MODE: ${{ needs.resolve-preview-release.outputs.source_mode }}
          PR_NUMBER: ${{ needs.resolve-preview-release.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-preview-release.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-preview-release.outputs.ci_run_url }}
          IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
          DATABASE_MODE: ${{ needs.resolve-preview-release.outputs.database_mode }}
          RESET_CONFIRMATION: ${{ needs.resolve-preview-release.outputs.reset_confirmation }}
          PREVIEW_URL: ${{ needs.resolve-preview-release.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const databaseVolume = `${process.env.DATABASE_MODE || "unknown"} pending`;
            const body = [
              marker,
              "",
              "Preview deploying",
              "",
              "Result: deploying",
              `Source mode: ${process.env.SOURCE_MODE || "unknown"}`,
              `Database mode: ${process.env.DATABASE_MODE || "preserve"}`,
              `Database volume: ${databaseVolume}`,
              `PR: #${issue_number}`,
              `Commit: ${process.env.VALIDATED_SHA}`,
              `Branch: ${process.env.HEAD_REF}`,
              `Fast CI run: ${process.env.CI_RUN_URL}`,
              `Image build run: ${runUrl}`,
              `Immutable image: ${process.env.IMAGE_REF}`,
              `Deployment run: ${runUrl}`,
              `Preview URL: ${process.env.PREVIEW_URL || "n/a"}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

  deploy-preview:
    needs:
      - resolve-preview-release
      - build-preview-image
      - report-deploying
    if: needs.resolve-preview-release.outputs.should_deploy == 'true' && needs.build-preview-image.result == 'success'
    runs-on:
      - self-hosted
      - windows
      - x64
      - clariobase-preview
    environment: e016-preview-operator
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      runner_revalidation_result: ${{ steps.revalidate.outputs.runner_revalidation_result }}
      runner_revalidation_reason: ${{ steps.revalidate.outputs.runner_revalidation_reason }}
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Check out trusted control checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: control/pnpm-lock.yaml

      - name: Install trusted control dependencies
        shell: pwsh
        working-directory: control
        run: pnpm install --frozen-lockfile

      - name: Revalidate release source before deployment
        id: revalidate
        shell: pwsh
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_MODE: ${{ needs.resolve-preview-release.outputs.source_mode }}
          PR_NUMBER: ${{ needs.resolve-preview-release.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $result = "PASS"
          $reason = ""

          try {
            switch ($env:SOURCE_MODE) {
              "open_pr" {
                if ([string]::IsNullOrWhiteSpace($env:PR_NUMBER) -or $env:PR_NUMBER -notmatch '^[1-9][0-9]*$') {
                  $result = "BLOCKED"
                  $reason = "BLOCKED: PR number is required for open_pr source mode"
                  break
                }

                $pr = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"

                if ($pr.state -ne "open") {
                  $result = "BLOCKED"
                  $reason = "BLOCKED: PR is no longer open"
                } elseif ($pr.head.repo.full_name -ne $env:REPOSITORY) {
                  $result = "BLOCKED"
                  $reason = "BLOCKED: PR head repository is no longer trusted"
                } elseif ($pr.head.sha.ToLowerInvariant() -ne $env:VALIDATED_SHA.ToLowerInvariant()) {
                  $result = "BLOCKED"
                  $reason = "BLOCKED: stale validated SHA"
                }
              }
              "main" {
                if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
                  $result = "BLOCKED"
                  $reason = "BLOCKED: PR number must be empty for main source mode"
                } elseif ($env:VALIDATED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
                  $result = "BLOCKED"
                  $reason = "BLOCKED: VALIDATED_SHA must be a full 40-character hexadecimal SHA"
                } elseif ($env:DISPATCH_SHA -notmatch '^[0-9a-fA-F]{40}$') {
                  $result = "BLOCKED"
                  $reason = "BLOCKED: DISPATCH_SHA must be a full 40-character hexadecimal SHA"
                } elseif ($env:VALIDATED_SHA.ToLowerInvariant() -ne $env:DISPATCH_SHA.ToLowerInvariant()) {
                  $result = "BLOCKED"
                  $reason = "BLOCKED: validated SHA does not match the trusted dispatch SHA"
                }
              }
              default {
                $result = "BLOCKED"
                $reason = "BLOCKED: unknown source mode"
              }
            }
          } catch {
            if ($result -ne "BLOCKED") {
              $result = "BLOCKED"
              $reason = "BLOCKED: runner-side release source revalidation request failed"
            }
          }

          "runner_revalidation_result=$result" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "runner_revalidation_reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stop on blocked runner revalidation
        if: steps.revalidate.outputs.runner_revalidation_result == 'BLOCKED'
        shell: pwsh
        env:
          BLOCK_REASON: ${{ steps.revalidate.outputs.runner_revalidation_reason }}
          PREVIEW_URL: ${{ needs.resolve-preview-release.outputs.preview_url }}
        run: |
          @"
          Result: BLOCKED

          Reason: $env:BLOCK_REASON
          Preview URL: $env:PREVIEW_URL
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Validate immutable image handoff
        if: steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        env:
          VALIDATED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          IMAGE_SOURCE_SHA: ${{ needs.build-preview-image.outputs.source_sha }}
          IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
        run: |
          if ($env:VALIDATED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "VALIDATED_SHA must be a full 40-character hexadecimal SHA."
          }

          if ($env:IMAGE_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "IMAGE_SOURCE_SHA must be a full 40-character hexadecimal SHA."
          }

          if ($env:IMAGE_SOURCE_SHA.ToLowerInvariant() -ne $env:VALIDATED_SHA.ToLowerInvariant()) {
            throw "IMAGE_SOURCE_SHA must match VALIDATED_SHA."
          }

          if ($env:IMAGE_REF -notmatch '^ghcr\.io/lukexd09/clariobase-ai-crm@sha256:[0-9a-f]{64}$') {
            throw "IMAGE_REF must be an immutable GHCR digest reference."
          }

      - name: Log in to GitHub Container Registry
        if: steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        id: ghcr-login
        shell: pwsh
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          $env:GHCR_TOKEN | docker login ghcr.io --username $env:GHCR_USERNAME --password-stdin

      - name: Materialize preview env file
        if: steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        working-directory: control
        env:
          CRM_PREVIEW_POSTGRES_PASSWORD: ${{ secrets.CRM_PREVIEW_POSTGRES_PASSWORD }}
          CRM_PREVIEW_BETTER_AUTH_SECRET: ${{ secrets.CRM_PREVIEW_BETTER_AUTH_SECRET }}
        run: |
          if (-not $env:CRM_PREVIEW_POSTGRES_PASSWORD) {
            throw "Missing required secret CRM_PREVIEW_POSTGRES_PASSWORD."
          }

          if (-not $env:CRM_PREVIEW_BETTER_AUTH_SECRET -or $env:CRM_PREVIEW_BETTER_AUTH_SECRET.Length -lt 32) {
            throw "Missing or short required secret CRM_PREVIEW_BETTER_AUTH_SECRET."
          }

          Copy-Item .env.compose.preview.example .env.compose.preview.local -Force
          $content = Get-Content .env.compose.preview.local
          $updated = $content -replace '^CRM_POSTGRES_PASSWORD=$', "CRM_POSTGRES_PASSWORD=$env:CRM_PREVIEW_POSTGRES_PASSWORD"
          $updated = $updated -replace '^BETTER_AUTH_SECRET=$', "BETTER_AUTH_SECRET=$env:CRM_PREVIEW_BETTER_AUTH_SECRET"
          Set-Content .env.compose.preview.local $updated

      - name: Deploy preview
        id: deploy
        if: steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        working-directory: control
        env:
          SOURCE_MODE: ${{ needs.resolve-preview-release.outputs.source_mode }}
          REQUESTED_REF: ${{ needs.resolve-preview-release.outputs.head_ref }}
          VALIDATED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          CRM_PREVIEW_IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
          DATABASE_MODE: ${{ needs.resolve-preview-release.outputs.database_mode }}
          RESET_CONFIRMATION: ${{ needs.resolve-preview-release.outputs.reset_confirmation }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy-preview.ps1 `
            -SourceMode $env:SOURCE_MODE `
            -RequestedRef $env:REQUESTED_REF `
            -ResolvedSha $env:VALIDATED_SHA `
            -DatabaseMode $env:DATABASE_MODE `
            -ResetConfirmation $env:RESET_CONFIRMATION `
            -ControlCheckoutPath $PWD `
            -PreviewEnvFile .\.env.compose.preview.local

          $deployExitCode = $LASTEXITCODE
          if ($deployExitCode -ne 0) {
            throw "Deploy preview script failed with exit code $deployExitCode."
          }

      - name: Verify preview readiness
        if: steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        working-directory: control
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          CRM_PREVIEW_IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
        run: |
          $previewUrl = [Uri]$env:PREVIEW_URL
          $previewHost = $previewUrl.DnsSafeHost
          $previewPort = $previewUrl.Port
          $previewCaPath = Join-Path $env:RUNNER_TEMP "preview-root.crt"

          try {
            docker compose `
              --env-file .\.env.compose.preview.local `
              -f compose.yaml `
              -f compose.preview.yaml `
              -f compose.preview.private-https.yaml `
              cp crm-private-ingress:/data/caddy/pki/authorities/local/root.crt $previewCaPath

            node .\scripts\verify-preview-readiness.mjs `
              --ca-path $previewCaPath `
              --hostname $previewHost `
              --port $previewPort

            if ($LASTEXITCODE -ne 0) {
              throw "Preview readiness verification failed."
            }
          } finally {
            Remove-Item $previewCaPath -Force -ErrorAction SilentlyContinue
          }

      - name: Write deployment summary
        if: success() && steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        env:
          SOURCE_MODE: ${{ needs.resolve-preview-release.outputs.source_mode }}
          PR_URL: ${{ needs.resolve-preview-release.outputs.pr_url }}
          HEAD_REF: ${{ needs.resolve-preview-release.outputs.head_ref }}
          VALIDATED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          DATABASE_MODE: ${{ needs.resolve-preview-release.outputs.database_mode }}
          RESET_CONFIRMATION: ${{ needs.resolve-preview-release.outputs.reset_confirmation }}
          CI_RUN_URL: ${{ needs.resolve-preview-release.outputs.ci_run_url }}
          IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          if ($env:DATABASE_MODE -eq "reset") {
            $databaseVolume = "reset"
          } else {
            $databaseVolume = "preserved"
          }

          @"
          Result: PASS

          Source mode: $env:SOURCE_MODE
          PR: $env:PR_URL
          Branch: $env:HEAD_REF
          Validated SHA: $env:VALIDATED_SHA
          Database mode: $env:DATABASE_MODE
          Database volume: $databaseVolume
          Preview URL: $env:PREVIEW_URL
          Deployment result: PASS
          Preview readiness: PASS
          Image identity: $env:IMAGE_REF
          Fast CI run: $env:CI_RUN_URL
          Image build run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Immutable image: $env:IMAGE_REF
          Deployment run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Cleanup secrets and job artifacts
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          Remove-Item .env.compose.preview.local, deploy-preview-result.json, stop-preview-result.json -Force -ErrorAction SilentlyContinue

      - name: Log out of GitHub Container Registry
        if: always() && steps.ghcr-login.conclusion == 'success'
        shell: pwsh
        run: |
          docker logout ghcr.io | Out-Host

      - name: Fail on blocked runner revalidation
        if: always() && steps.revalidate.outputs.runner_revalidation_result == 'BLOCKED'
        shell: pwsh
        env:
          BLOCK_REASON: ${{ steps.revalidate.outputs.runner_revalidation_reason }}
        run: |
          throw $env:BLOCK_REASON

  report-final:
    needs:
      - resolve-preview-release
      - build-preview-image
      - deploy-preview
    if: always() && needs.resolve-preview-release.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Upsert final preview comment
        if: needs.resolve-preview-release.outputs.reporting_target == 'pull_request'
        uses: actions/github-script@v8
        env:
          SOURCE_MODE: ${{ needs.resolve-preview-release.outputs.source_mode }}
          PR_NUMBER: ${{ needs.resolve-preview-release.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-preview-release.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-preview-release.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-preview-release.outputs.ci_run_url }}
          IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
          BUILD_RESULT: ${{ needs.build-preview-image.result }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-preview.result }}
          RUNNER_REVALIDATION_RESULT: ${{ needs.deploy-preview.outputs.runner_revalidation_result }}
          RUNNER_REVALIDATION_REASON: ${{ needs.deploy-preview.outputs.runner_revalidation_reason }}
          DATABASE_MODE: ${{ needs.resolve-preview-release.outputs.database_mode }}
          PREVIEW_URL: ${{ needs.resolve-preview-release.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const issue_number = Number(process.env.PR_NUMBER);
            const blocked = process.env.RUNNER_REVALIDATION_RESULT === "BLOCKED";
            const ready = process.env.BUILD_RESULT === "success" && process.env.DEPLOYMENT_RESULT === "success";
            const result = blocked ? "blocked" : ready ? "ready" : "failed";
            const title = blocked ? "Preview blocked" : ready ? "Preview ready" : "Preview failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const databaseMode = process.env.DATABASE_MODE || "unknown";
            const databaseVolume = blocked ? "unchanged" : ready ? (databaseMode === "reset" ? "reset" : "preserved") : "unknown";
            const lines = [
              marker,
              "",
              title,
              "",
              `Result: ${result}`
            ];
            if (blocked) {
              lines.push(`Reason: ${process.env.RUNNER_REVALIDATION_REASON || "BLOCKED: stale validated SHA"}`);
            }
            lines.push(
              `Source mode: ${process.env.SOURCE_MODE || "unknown"}`,
              `Database mode: ${databaseMode}`,
              `Database volume: ${databaseVolume}`,
              `PR: #${issue_number}`,
              `Commit: ${process.env.VALIDATED_SHA}`,
              `Branch: ${process.env.HEAD_REF}`,
              `Fast CI run: ${process.env.CI_RUN_URL}`,
              `Image build run: ${runUrl}`,
              `Immutable image: ${process.env.IMAGE_REF || "n/a"}`,
              `Deployment run: ${runUrl}`,
              `Preview URL: ${process.env.PREVIEW_URL || "n/a"}`,
              `Timestamp: ${new Date().toISOString()}`
            );
            const body = lines.join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

      - name: Enforce final Preview Release result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-preview-image.result }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-preview.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ] || [ "$DEPLOYMENT_RESULT" != "success" ]; then
            echo "Preview Release did not complete successfully." >&2
            exit 1
          fi
