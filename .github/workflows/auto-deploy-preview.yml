name: Auto Deploy Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: clariobase-preview-slot
  cancel-in-progress: false

jobs:
  resolve-auto-preview:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      resolution_status: ${{ steps.resolve.outputs.resolution_status }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_url: ${{ steps.resolve.outputs.pr_url }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      validated_sha: ${{ steps.resolve.outputs.validated_sha }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      ci_run_url: ${{ steps.resolve.outputs.ci_run_url }}
      gate_result: ${{ steps.classify.outputs.gate_result || steps.classify_failure.outputs.gate_result }}
      gate_reason: ${{ steps.classify.outputs.gate_reason || steps.classify_failure.outputs.gate_reason }}

    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Download auto-preview context artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-preview-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: /tmp/auto-preview-context

      - name: Resolve trusted PR head
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node ./node_modules/tsx/dist/cli.mjs scripts/resolve-auto-preview.ts
          --event-path "${{ github.event_path }}"
          --repository "${{ github.repository }}"
          --context-path "/tmp/auto-preview-context/auto-preview-context.json"

      - name: Classify resolver execution failure
        if: failure()
        shell: bash
        run: |
          {
            echo "gate_result=BLOCKED"
            echo "gate_reason=BLOCKED: resolver execution failed"
          } >> "$GITHUB_OUTPUT"
        id: classify_failure

      - name: Classify gate result
        if: success()
        id: classify
        shell: bash
        env:
          RESOLUTION_STATUS: ${{ steps.resolve.outputs.resolution_status }}
          SHOULD_DEPLOY: ${{ steps.resolve.outputs.should_deploy }}
          SKIP_REASON: ${{ steps.resolve.outputs.skip_reason }}
        run: |
          if [ "$RESOLUTION_STATUS" = "deploy" ] && [ "$SHOULD_DEPLOY" = "true" ]; then
            {
              echo "gate_result=PASS"
              echo "gate_reason=eligible"
            } >> "$GITHUB_OUTPUT"
          elif [ "$RESOLUTION_STATUS" = "blocked" ]; then
            {
              echo "gate_result=BLOCKED"
              echo "gate_reason=$SKIP_REASON"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "gate_result=SKIPPED"
              echo "gate_reason=$SKIP_REASON"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write gate summary
        if: always()
        shell: bash
        env:
          GATE_RESULT: ${{ steps.classify.outputs.gate_result || steps.classify_failure.outputs.gate_result }}
          PR_URL: ${{ steps.resolve.outputs.pr_url }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          VALIDATED_SHA: ${{ steps.resolve.outputs.validated_sha }}
          CI_RUN_URL: ${{ steps.resolve.outputs.ci_run_url }}
          GATE_REASON: ${{ steps.classify.outputs.gate_reason || steps.classify_failure.outputs.gate_reason }}
        run: |
          {
            echo "Result: ${GATE_RESULT:-BLOCKED}"
            echo
            echo "PR: ${PR_URL:-n/a}"
            echo "Branch: ${HEAD_REF:-n/a}"
            echo "Validated SHA: ${VALIDATED_SHA:-n/a}"
            echo "CI run: ${CI_RUN_URL:-n/a}"
            echo "Reason: ${GATE_REASON:-BLOCKED: resolver execution failed}"
          } >> "$GITHUB_STEP_SUMMARY"

  report-blocked-resolution:
    needs: resolve-auto-preview
    if: >
      always() &&
      needs.resolve-auto-preview.outputs.gate_result == 'BLOCKED' &&
      needs.resolve-auto-preview.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Upsert blocked preview comment
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve-auto-preview.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-auto-preview.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-auto-preview.outputs.ci_run_url }}
          BLOCK_REASON: ${{ needs.resolve-auto-preview.outputs.gate_reason }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const issue_number = Number(process.env.PR_NUMBER);

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              throw new Error("Invalid PR number.");
            }

            const body = [
              marker,
              "",
              "Preview blocked",
              "",
              "Result: blocked",
              `Reason: ${process.env.BLOCK_REASON || "BLOCKED: resolver execution failed"}`,
              "URL: http://Serwer:3001",
              `Commit: ${process.env.VALIDATED_SHA || "n/a"}`,
              `Branch: ${process.env.HEAD_REF || "n/a"}`,
              `CI: ${process.env.CI_RUN_URL || "n/a"}`,
              `Deployment: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

      - name: Fail blocked preview gate
        if: always()
        shell: bash
        env:
          GATE_REASON: ${{ needs.resolve-auto-preview.outputs.gate_reason }}
        run: |
          echo "${GATE_REASON:-BLOCKED: resolver execution failed}"
          exit 1

  build-preview-image:
    needs: resolve-auto-preview
    if: needs.resolve-auto-preview.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
      source_sha: ${{ steps.publish.outputs.source_sha }}
      ci_run_id: ${{ steps.publish.outputs.ci_run_id }}
      image_build_run_id: ${{ steps.publish.outputs.image_build_run_id }}

    steps:
      - name: Check out validated source SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.resolve-auto-preview.outputs.validated_sha }}

      - name: Build immutable preview image
        id: build-image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Smoke test immutable image
        shell: pwsh
        run: |
          $imageRef = "ghcr.io/${{ github.repository }}:${{ needs.resolve-auto-preview.outputs.validated_sha }}"
          $env:CRM_PREVIEW_IMAGE_REF = $imageRef
          $env:CRM_POSTGRES_PASSWORD = "preview-password"
          corepack pnpm exec tsx tests/fixtures/health-container-smoke.ts $imageRef 3001

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push immutable preview image
        id: push
        shell: bash
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ needs.resolve-auto-preview.outputs.validated_sha }}
        run: |
          docker push "$IMAGE_TAG" | tee docker-push.log

          mapfile -t DIGESTS < <(
            sed -nE 's/^.*digest: (sha256:[0-9a-f]{64})( size:.*)?$/\1/p' docker-push.log |
              sort -u
          )

          if [ "${#DIGESTS[@]}" -ne 1 ]; then
            echo "Expected exactly one pushed registry digest, found ${#DIGESTS[@]}." >&2
            exit 1
          fi

          IMAGE_DIGEST="${DIGESTS[0]}"

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid registry digest: $IMAGE_DIGEST" >&2
            exit 1
          fi

          IMAGE_REF="ghcr.io/${{ github.repository }}@${IMAGE_DIGEST}"

          {
            echo "image_digest=${IMAGE_DIGEST}"
            echo "image_ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish immutable image metadata
        id: publish
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          IMAGE_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository }}@${IMAGE_DIGEST}"

          cat > immutable-preview-image.json <<JSON
          {
            "repository": "${{ github.repository }}",
            "sourceSha": "${SOURCE_SHA}",
            "image": "ghcr.io/${{ github.repository }}",
            "digest": "${IMAGE_DIGEST}",
            "imageRef": "${IMAGE_REF}",
            "ciRunId": "${CI_RUN_ID}",
            "imageBuildRunId": "${IMAGE_BUILD_RUN_ID}"
          }
          JSON

          {
            echo "image_ref=${IMAGE_REF}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo "source_sha=${SOURCE_SHA}"
            echo "ci_run_id=${CI_RUN_ID}"
            echo "image_build_run_id=${IMAGE_BUILD_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable preview image metadata
        uses: actions/upload-artifact@v4
        with:
          name: immutable-preview-image
          path: immutable-preview-image.json
          retention-days: 7

  report-deploying:
    needs:
      - resolve-auto-preview
      - build-preview-image
    if: needs.resolve-auto-preview.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Upsert PR preview comment as deploying
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve-auto-preview.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-auto-preview.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-auto-preview.outputs.ci_run_url }}
          IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
          IMAGE_BUILD_RUN_ID: ${{ needs.build-preview-image.outputs.image_build_run_id }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const issue_number = Number(process.env.PR_NUMBER);

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              throw new Error("Invalid PR number.");
            }

            const body = [
              marker,
              "",
              "Preview deploying",
              "",
              "Result: deploying",
              "URL: http://Serwer:3001",
              `Commit: ${process.env.VALIDATED_SHA}`,
              `Image: ${process.env.IMAGE_REF}`,
              `Branch: ${process.env.HEAD_REF}`,
              `CI: ${process.env.CI_RUN_URL}`,
              `Image build: ${process.env.IMAGE_BUILD_RUN_ID}`,
              `Deployment: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

  deploy-preview:
    needs:
      - resolve-auto-preview
      - build-preview-image
      - report-deploying
    if: needs.resolve-auto-preview.outputs.should_deploy == 'true'
    runs-on:
      - self-hosted
      - windows
      - x64
      - clariobase-preview
    environment: e016-preview-operator
    permissions:
      contents: read
      packages: read
      pull-requests: read

    steps:
      - name: Check out trusted control checkout
        uses: actions/checkout@v5
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        working-directory: control
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        working-directory: control
        run: corepack pnpm install --frozen-lockfile

      - name: Revalidate PR head before deployment
        id: revalidate
        shell: pwsh
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-auto-preview.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $result = "PASS"
          $reason = ""

          try {
            $pr = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"

            if ($pr.state -ne "open") {
              $result = "BLOCKED"
              $reason = "BLOCKED: PR is no longer open"
            } elseif ($pr.head.repo.full_name -ne $env:REPOSITORY) {
              $result = "BLOCKED"
              $reason = "BLOCKED: PR head repository is no longer trusted"
            } elseif ($pr.head.sha.ToLowerInvariant() -ne $env:VALIDATED_SHA.ToLowerInvariant()) {
              $result = "BLOCKED"
              $reason = "BLOCKED: stale validated SHA"
            }
          } catch {
            $result = "BLOCKED"
            $reason = "BLOCKED: runner-side PR revalidation request failed"
          }

          "runner_revalidation_result=$result" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "runner_revalidation_reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stop on blocked runner revalidation
        if: steps.revalidate.outputs.runner_revalidation_result == 'BLOCKED'
        shell: pwsh
        env:
          BLOCK_REASON: ${{ steps.revalidate.outputs.runner_revalidation_reason }}
        run: |
          @"
          Result: BLOCKED

          Reason: $env:BLOCK_REASON
          Preview URL: http://Serwer:3001
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Fail on blocked runner revalidation
        if: steps.revalidate.outputs.runner_revalidation_result == 'BLOCKED'
        shell: pwsh
        env:
          BLOCK_REASON: ${{ steps.revalidate.outputs.runner_revalidation_reason }}
        run: |
          throw $env:BLOCK_REASON

      - name: Materialize preview env file
        if: steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        working-directory: control
        env:
          CRM_PREVIEW_POSTGRES_PASSWORD: ${{ secrets.CRM_PREVIEW_POSTGRES_PASSWORD }}
        run: |
          if (-not $env:CRM_PREVIEW_POSTGRES_PASSWORD) {
            throw "Missing required secret CRM_PREVIEW_POSTGRES_PASSWORD."
          }

          Copy-Item .env.compose.preview.example .env.compose.preview.local -Force
          $content = Get-Content .env.compose.preview.local
          $updated = $content -replace '^CRM_POSTGRES_PASSWORD=$', "CRM_POSTGRES_PASSWORD=$env:CRM_PREVIEW_POSTGRES_PASSWORD"
          Set-Content .env.compose.preview.local $updated

      - name: Deploy preview
        id: deploy
        if: steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        working-directory: control
        env:
          REQUESTED_REF: ${{ needs.resolve-auto-preview.outputs.head_ref }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          CRM_PREVIEW_IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy-preview.ps1 `
            -RequestedRef $env:REQUESTED_REF `
            -ResolvedSha $env:VALIDATED_SHA `
            -ControlCheckoutPath $PWD `
            -PreviewEnvFile .\.env.compose.preview.local

          $deployExitCode = $LASTEXITCODE

          if ($deployExitCode -ne 0) {
            throw "Deploy preview script failed with exit code $deployExitCode."
          }

          "preview_url=http://Serwer:3001" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify preview readiness
        if: steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Method Get -Uri "http://127.0.0.1:3001/api/ready"
          if ($response.StatusCode -ne 200) {
            throw "Preview readiness HTTP status was $($response.StatusCode)."
          }

          $preview = $response.Content | ConvertFrom-Json

          if ($preview.status -ne "ok" -or $preview.checks.database -ne "ok") {
            throw "Preview readiness failed."
          }

      - name: Write deployment summary
        if: success() && steps.revalidate.outputs.runner_revalidation_result == 'PASS'
        shell: pwsh
        env:
          PR_URL: ${{ needs.resolve-auto-preview.outputs.pr_url }}
          HEAD_REF: ${{ needs.resolve-auto-preview.outputs.head_ref }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          CI_RUN_URL: ${{ needs.resolve-auto-preview.outputs.ci_run_url }}
        run: |
          @"
          Result: PASS

          PR: $env:PR_URL
          Branch: $env:HEAD_REF
          Validated SHA: $env:VALIDATED_SHA
          Preview URL: http://Serwer:3001
          Preview readiness: PASS
          CI run: $env:CI_RUN_URL
          Image build run: ${{ needs.build-preview-image.outputs.image_build_run_id }}
          Deployment run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Cleanup secrets and job artifacts
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          Remove-Item .env.compose.preview.local, deploy-preview-result.json, stop-preview-result.json -Force -ErrorAction SilentlyContinue

  report-final:
    needs:
      - resolve-auto-preview
      - build-preview-image
      - deploy-preview
    if: always() && needs.resolve-auto-preview.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Upsert final preview comment
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve-auto-preview.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-auto-preview.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-auto-preview.outputs.ci_run_url }}
          IMAGE_REF: ${{ needs.build-preview-image.outputs.image_ref }}
          IMAGE_BUILD_RUN_ID: ${{ needs.build-preview-image.outputs.image_build_run_id }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-preview.result }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const issue_number = Number(process.env.PR_NUMBER);

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              throw new Error("Invalid PR number.");
            }

            const ready = process.env.DEPLOYMENT_RESULT === "success";
            const body = [
              marker,
              "",
              ready ? "Preview ready" : "Preview failed",
              "",
              `Result: ${ready ? "ready" : "failed"}`,
              "URL: http://Serwer:3001",
              `Commit: ${process.env.VALIDATED_SHA}`,
              `Image: ${process.env.IMAGE_REF || "n/a"}`,
              `Branch: ${process.env.HEAD_REF}`,
              `CI: ${process.env.CI_RUN_URL}`,
              `Image build: ${process.env.IMAGE_BUILD_RUN_ID}`,
              `Deployment: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }
