name: Auto Deploy Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: clariobase-preview-slot
  cancel-in-progress: false

jobs:
  resolve-auto-preview:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_url: ${{ steps.resolve.outputs.pr_url }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      validated_sha: ${{ steps.resolve.outputs.validated_sha }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      ci_run_url: ${{ steps.resolve.outputs.ci_run_url }}
      gate_result: ${{ steps.gate_result.outputs.gate_result }}

    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Resolve trusted PR head
        id: resolve
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node ./node_modules/tsx/dist/cli.mjs scripts/resolve-auto-preview.ts
          --event-path "${{ github.event_path }}"
          --repository "${{ github.repository }}"

      - name: Classify gate result
        id: gate_result
        shell: bash
        run: |
          if [ "${{ steps.resolve.outcome }}" = "success" ] && [ "${{ steps.resolve.outputs.should_deploy }}" = "true" ]; then
            echo "gate_result=PASS" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.resolve.outputs.skip_reason }}" == BLOCKED:* ]]; then
            echo "gate_result=BLOCKED" >> "$GITHUB_OUTPUT"
          else
            echo "gate_result=SKIPPED" >> "$GITHUB_OUTPUT"
          fi

      - name: Write gate summary
        shell: bash
        run: |
          {
            echo "Result: ${{ steps.gate_result.outputs.gate_result }}"
            echo
            echo "PR: ${{ steps.resolve.outputs.pr_url || 'n/a' }}"
            echo "Branch: ${{ steps.resolve.outputs.head_ref || 'n/a' }}"
            echo "Validated SHA: ${{ steps.resolve.outputs.validated_sha || 'n/a' }}"
            echo "CI run: ${{ steps.resolve.outputs.ci_run_url || 'n/a' }}"
            echo "Reason: ${{ steps.resolve.outputs.skip_reason || 'eligible' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR preview comment as blocked
        if: steps.gate_result.outputs.gate_result == 'BLOCKED' && steps.resolve.outputs.pr_number != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          VALIDATED_SHA: ${{ steps.resolve.outputs.validated_sha }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          CI_RUN_URL: ${{ steps.resolve.outputs.ci_run_url }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const body = [
              marker,
              "",
              "Preview blocked",
              "",
              "Result: blocked",
              "URL: http://Serwer:3001",
              `Commit: ${process.env.VALIDATED_SHA || "n/a"}`,
              `Branch: ${process.env.HEAD_REF || "n/a"}`,
              `CI: ${process.env.CI_RUN_URL || "n/a"}`,
              `Deployment: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }

      - name: Fail on blocked gate
        if: steps.gate_result.outputs.gate_result == 'BLOCKED'
        shell: bash
        run: |
          echo "${{ steps.resolve.outputs.skip_reason || 'BLOCKED: ambiguous event payload' }}"
          exit 1

  deploy-preview:
    needs: resolve-auto-preview
    if: needs.resolve-auto-preview.outputs.should_deploy == 'true'
    runs-on:
      - self-hosted
      - windows
      - x64
      - clariobase-preview
    environment: e016-preview-operator

    steps:
      - name: Check out trusted control checkout
        uses: actions/checkout@v5
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out validated source SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        working-directory: control
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        working-directory: control
        run: corepack pnpm install --frozen-lockfile

      - name: Revalidate PR head before deployment
        shell: pwsh
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $prNumber = "${{ needs.resolve-auto-preview.outputs.pr_number }}"
          $pr = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/pulls/$prNumber"

          if ($pr.state -ne "open") {
            throw "BLOCKED: PR is no longer open"
          }

          if ($pr.head.repo.full_name -ne "${{ github.repository }}") {
            throw "BLOCKED: PR head repository is no longer trusted"
          }

          if ($pr.head.sha.ToLowerInvariant() -ne "${{ needs.resolve-auto-preview.outputs.validated_sha }}") {
            throw "BLOCKED: stale validated SHA"
          }

      - name: Materialize preview env file
        shell: pwsh
        working-directory: control
        env:
          CRM_PREVIEW_POSTGRES_PASSWORD: ${{ secrets.CRM_PREVIEW_POSTGRES_PASSWORD }}
        run: |
          if (-not $env:CRM_PREVIEW_POSTGRES_PASSWORD) {
            throw "Missing required secret CRM_PREVIEW_POSTGRES_PASSWORD."
          }

          Copy-Item .env.compose.preview.example .env.compose.preview.local -Force
          $content = Get-Content .env.compose.preview.local
          $updated = $content -replace '^CRM_POSTGRES_PASSWORD=$', "CRM_POSTGRES_PASSWORD=$env:CRM_PREVIEW_POSTGRES_PASSWORD"
          Set-Content .env.compose.preview.local $updated

      - name: Upsert PR preview comment as deploying
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve-auto-preview.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-auto-preview.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-auto-preview.outputs.ci_run_url }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const body = [
              marker,
              "",
              "Preview deploying",
              "",
              "Result: deploying",
              "URL: http://Serwer:3001",
              `Commit: ${process.env.VALIDATED_SHA}`,
              `Branch: ${process.env.HEAD_REF}`,
              `CI: ${process.env.CI_RUN_URL}`,
              `Deployment: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }

      - name: Deploy preview
        id: deploy
        shell: pwsh
        working-directory: control
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy-preview.ps1 `
            -RequestedRef "${{ needs.resolve-auto-preview.outputs.head_ref }}" `
            -ResolvedSha "${{ needs.resolve-auto-preview.outputs.validated_sha }}" `
            -ControlCheckoutPath $PWD `
            -SourceCheckoutPath (Join-Path $PWD "..\source") `
            -PreviewEnvFile .\.env.compose.preview.local

          $deployExitCode = $LASTEXITCODE

          if ($deployExitCode -ne 0) {
            throw "Deploy preview script failed with exit code $deployExitCode."
          }

          "preview_url=http://Serwer:3001" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify preview readiness
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Method Get -Uri "http://127.0.0.1:3001/api/ready"
          if ($response.StatusCode -ne 200) {
            throw "Preview readiness HTTP status was $($response.StatusCode)."
          }

          $preview = $response.Content | ConvertFrom-Json

          if ($preview.status -ne "ok" -or $preview.checks.database -ne "ok") {
            throw "Preview readiness failed."
          }

      - name: Verify production readiness
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Method Get -Uri "http://127.0.0.1:3000/api/ready"
          if ($response.StatusCode -ne 200) {
            throw "Production readiness HTTP status was $($response.StatusCode)."
          }

          $production = $response.Content | ConvertFrom-Json

          if ($production.status -ne "ok" -or $production.checks.database -ne "ok") {
            throw "Production readiness failed."
          }

      - name: Write deployment summary
        if: success()
        shell: pwsh
        run: |
          @"
          Result: PASS

          PR: `${{ needs.resolve-auto-preview.outputs.pr_url }}`
          Branch: `${{ needs.resolve-auto-preview.outputs.head_ref }}`
          Validated SHA: `${{ needs.resolve-auto-preview.outputs.validated_sha }}`
          Preview URL: `http://Serwer:3001`
          Preview readiness: PASS
          Production readiness: PASS
          CI run: `${{ needs.resolve-auto-preview.outputs.ci_run_url }}`
          Deployment run: `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upsert PR preview comment as ready
        if: success()
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve-auto-preview.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-auto-preview.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-auto-preview.outputs.ci_run_url }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const body = [
              marker,
              "",
              "Preview ready",
              "",
              "Result: ready",
              "URL: http://Serwer:3001",
              `Commit: ${process.env.VALIDATED_SHA}`,
              `Branch: ${process.env.HEAD_REF}`,
              `CI: ${process.env.CI_RUN_URL}`,
              `Deployment: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }

      - name: Upsert PR preview comment as failed
        if: failure()
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve-auto-preview.outputs.pr_number }}
          VALIDATED_SHA: ${{ needs.resolve-auto-preview.outputs.validated_sha }}
          HEAD_REF: ${{ needs.resolve-auto-preview.outputs.head_ref }}
          CI_RUN_URL: ${{ needs.resolve-auto-preview.outputs.ci_run_url }}
        with:
          script: |
            const marker = "<!-- clariobase-preview-status -->";
            const body = [
              marker,
              "",
              "Preview failed",
              "",
              "Result: failed",
              "URL: http://Serwer:3001",
              `Commit: ${process.env.VALIDATED_SHA}`,
              `Branch: ${process.env.HEAD_REF}`,
              `CI: ${process.env.CI_RUN_URL}`,
              `Deployment: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Timestamp: ${new Date().toISOString()}`
            ].join("\n");
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }

      - name: Cleanup secrets and job artifacts
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          Remove-Item .env.compose.preview.local, deploy-preview-result.json, stop-preview-result.json -Force -ErrorAction SilentlyContinue
