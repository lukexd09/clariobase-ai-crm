name: Deploy Preview

on:
  workflow_dispatch:
    inputs:
      requested_ref:
        description: Trusted repository branch, tag, or exact commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: clariobase-preview-slot
  cancel-in-progress: false

jobs:
  resolve-preview-ref:
    runs-on: ubuntu-latest
    outputs:
      requested_ref: ${{ steps.resolve.outputs.requested_ref }}
      resolved_sha: ${{ steps.resolve.outputs.resolved_sha }}

    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Resolve trusted preview ref
        id: resolve
        run: >
          node ./node_modules/tsx/dist/cli.mjs scripts/resolve-preview-ref.ts
          --requested-ref "${{ inputs.requested_ref }}"
          --repository "${{ github.repository }}"

  deploy-preview:
    needs: resolve-preview-ref
    runs-on:
      - self-hosted
      - windows
      - x64
      - clariobase-preview
    environment: e016-preview-operator
    if: github.actor == github.repository_owner

    steps:
      - name: Check out trusted control checkout
        uses: actions/checkout@v5
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out requested source SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-preview-ref.outputs.resolved_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        working-directory: control
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        working-directory: control
        run: corepack pnpm install --frozen-lockfile

      - name: Materialize preview env file
        shell: pwsh
        working-directory: control
        env:
          CRM_PREVIEW_POSTGRES_PASSWORD: ${{ secrets.CRM_PREVIEW_POSTGRES_PASSWORD }}
        run: |
          if (-not $env:CRM_PREVIEW_POSTGRES_PASSWORD) {
            throw "Missing required secret CRM_PREVIEW_POSTGRES_PASSWORD."
          }

          Copy-Item .env.compose.preview.example .env.compose.preview.local -Force
          $content = Get-Content .env.compose.preview.local
          $updated = $content -replace '^CRM_POSTGRES_PASSWORD=$', "CRM_POSTGRES_PASSWORD=$env:CRM_PREVIEW_POSTGRES_PASSWORD"
          Set-Content .env.compose.preview.local $updated

      - name: Resolve immutable preview image digest
        id: image
        shell: pwsh
        working-directory: control
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ needs.resolve-preview-ref.outputs.resolved_sha }}
        run: |
          docker pull $env:IMAGE_TAG
          $digest = docker inspect --format='{{index .RepoDigests 0}}' $env:IMAGE_TAG

          if (-not $digest -or $digest -notmatch '@sha256:[0-9a-f]{64}$') {
            throw "Could not resolve immutable digest for $env:IMAGE_TAG."
          }

          "preview_image_ref=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Deploy preview
        id: deploy
        shell: pwsh
        working-directory: control
        env:
          CRM_PREVIEW_IMAGE_REF: ${{ steps.image.outputs.preview_image_ref }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy-preview.ps1 `
            -RequestedRef "${{ needs.resolve-preview-ref.outputs.requested_ref }}" `
            -ResolvedSha "${{ needs.resolve-preview-ref.outputs.resolved_sha }}" `
            -ControlCheckoutPath $PWD `
            -SourceCheckoutPath (Join-Path $PWD "..\source") `
            -PreviewEnvFile .\.env.compose.preview.local

          $deployExitCode = $LASTEXITCODE

          if ($deployExitCode -ne 0) {
            throw "Deploy preview script failed with exit code $deployExitCode."
          }

          "preview_url=http://Serwer:3001" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "resolved_sha=${{ needs.resolve-preview-ref.outputs.resolved_sha }}" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Write job summary
        shell: pwsh
        working-directory: control
        run: |
          @"
          Result: PASS

          Requested ref: `${{ needs.resolve-preview-ref.outputs.requested_ref }}`
          Resolved SHA: `${{ needs.resolve-preview-ref.outputs.resolved_sha }}`
          Approved preview URL: `http://Serwer:3001`
          Preview URL: `${{ steps.deploy.outputs.preview_url }}`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Cleanup secrets and job artifacts
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          Remove-Item .env.compose.preview.local, deploy-preview-result.json, stop-preview-result.json -Force -ErrorAction SilentlyContinue
